# Loopback-only DNS forwarder.
# bionic's resolver inside the chroot hits 0.0.0.0:53 (no nameserver
# configured); the kernel routes that to 127.0.0.1:53 where this dnsmasq
# answers by forwarding to the upstreams below.
listen-address=127.0.0.1
bind-interfaces
no-resolv
server=1.1.1.1
server=9.9.9.9
